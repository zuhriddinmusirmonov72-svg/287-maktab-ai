services:
  - type: worker
    name: uz-ai-hub
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: ./data/uz-ai-hub.db
      - key: DAILY_USER_LIMIT
        value: 30
      - key: USER_COOLDOWN_SECONDS
        value: 2
      - key: AI_TIMEOUT_MS
        value: 60000
      - key: MAX_HISTORY_MESSAGES
        value: 12
      - key: MAX_INPUT_LENGTH
        value: 6000
      - key: TIMEZONE
        value: Asia/Tashkent
